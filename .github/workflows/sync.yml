name: Sync portfolio drafts

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths: ["portfolio.config.json"]

permissions:
  contents: write
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        name: Check required credentials
        shell: bash
        run: echo "configured=${{ secrets.PORTFOLIO_GITHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Fail clearly for manual runs without credentials
        if: steps.credentials.outputs.configured != 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "::error::PORTFOLIO_GITHUB_TOKEN is not configured. See README#setup."
          exit 1
      - name: Skip scheduled or push sync without credentials
        if: steps.credentials.outputs.configured != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "::notice::Skipping sync — PORTFOLIO_GITHUB_TOKEN not configured. See README#setup."
  sync:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate drafts and cleanup records
        run: npm --silent run sync > sync-result.json
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      - name: Create or update one approval PR per draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/portfolio-drafts"
          node -e 'const fs=require("fs"); for (const d of JSON.parse(fs.readFileSync("sync-result.json")).drafts) { fs.copyFileSync(d.draftFile, process.env.RUNNER_TEMP+"/portfolio-drafts/"+d.id+".json"); }'
          while IFS=$'\t' read -r id repo_name repo_url readme_url summary branch; do
            [ -n "$id" ] || continue
            git checkout -B "$branch" "$base"
            mkdir -p data/drafts
            cp "$RUNNER_TEMP/portfolio-drafts/$id.json" "data/drafts/$id.json"
            npx tsx scripts/promote-draft.ts "data/drafts/$id.json"
            git config user.name "portfolio-sync[bot]"
            git config user.email "portfolio-sync[bot]@users.noreply.github.com"
            git add "data/projects.json"
            test "$(git diff --cached --name-only)" = "data/projects.json"
            git commit -m "chore: approve portfolio draft $repo_name"
            git push --force-with-lease origin "HEAD:$branch"
            body="$(printf '%s\n\nRepository: %s\nREADME: %s' "$summary" "$repo_url" "$readme_url")"
            number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$number" ]; then
              gh pr edit "$number" --title "Portfolio draft: $repo_name" --body "$body"
            else
              gh pr create --base main --head "$branch" --title "Portfolio draft: $repo_name" --body "$body"
            fi
          done < <(node -e 'for (const d of JSON.parse(require("fs").readFileSync("sync-result.json")).drafts) console.log([d.id,d.repoName,d.repoUrl,d.readmeUrl,d.summary,d.branch].join("\t"))')
      - name: Create or update aggregate cleanup PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("sync-result.json")).cleanup.length)')"
          [ "$count" -gt 0 ] || exit 0
          branch="portfolio/sync-log"
          git checkout -B "$branch" "${GITHUB_SHA}"
          node -e 'const fs=require("fs"); const p="data/projects.json"; const r=JSON.parse(fs.readFileSync("sync-result.json")); const ids=new Set(r.cleanup.map(x=>x.id)); const projects=JSON.parse(fs.readFileSync(p)); fs.writeFileSync(p, JSON.stringify(projects.filter(x=>!ids.has(x.id)).sort((a,b)=>a.id.localeCompare(b.id)),null,2)+"\n")'
          git config user.name "portfolio-sync[bot]"
          git config user.email "portfolio-sync[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove opted-out portfolio projects"
          git push --force-with-lease origin "HEAD:$branch"
          title="$(node -e 'const r=JSON.parse(require("fs").readFileSync("sync-result.json")).cleanup; console.log(r.length===1 ? `Portfolio: remove ${r[0].repoName} (repo no longer opted in)` : "Portfolio: remove opted-out repositories")')"
          body="$(node -e 'const r=JSON.parse(require("fs").readFileSync("sync-result.json")).cleanup; console.log(r.map(x=>`- ${x.sourceRepo}: ${x.reason}`).join("\n"))')"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then gh pr edit "$number" --title "$title" --body "$body"; else gh pr create --base main --head "$branch" --title "$title" --body "$body"; fi
